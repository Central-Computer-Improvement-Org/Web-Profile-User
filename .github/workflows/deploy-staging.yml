name: Deploy CCI staging

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:20.10.7
        options: --privileged
        ports:
          - 3000:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --tag kevinirawand/fe-cci-web-profile:production \
            -f Dockerfile .
        env:
            NEXT_PUBLIC_OUTPUT: ${{ secrets.STAGING_OUTPUT }}
            NEXT_PUBLIC_HOST: ${{ secrets.NEXT_PUBLIC_HOST }}
            NEXT_PUBLIC_ASSET_PREFIX: ${{ secrets.STAGING_ASSET_PREFIX }}
            NEXT_PUBLIC_BASE_PATH: ${{ secrets.STAGING_BASE_PATH }}

      - name: Deploy with Docker Compose
        run: |
          docker-compose down
          docker-compose up -d

      - name: Verify Deployment
        run: curl -f http://localhost:3000 || exit 1
